default: &default
  store_options:
    # Cap matches Azure Redis C1 (1GB) so the store does not grow past the old Redis size.
    max_age: <%= 30.days.to_i %>
    max_size: <%= 1.gigabytes %>
    namespace: <%= Rails.env %>
    expiry_method: :job
    expiry_queue: low_priority

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

qa:
  <<: *default

review:
  <<: *default

staging:
  <<: *default

sandbox:
  <<: *default

loadtest:
  <<: *default

rollover:
  <<: *default
