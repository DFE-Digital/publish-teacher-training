# Slower polling for burstable QA / staging / sandbox / review databases.
# Explicit dispatcher from day one — Apply omitted this in production and delayed jobs stuck.
#
# Solid Queue looks up Rails.env in this file. PTT uses dedicated RAILS_ENV values
# (qa, staging, …), so each environment needs its own key — a lone `default:` is ignored.
default: &default
  dispatchers:
    - polling_interval: 3
      batch_size: 500
      concurrency_maintenance_interval: 300
  workers:
    - queues: [default, geocoding, mailers]
      threads: 1
      processes: 1
      polling_interval: 3

    - queues: [save_statistic, low_priority]
      threads: 1
      processes: 1
      polling_interval: 3

qa:
  <<: *default

staging:
  <<: *default

sandbox:
  <<: *default

review:
  <<: *default

test:
  <<: *default

loadtest:
  <<: *default

rollover:
  <<: *default
