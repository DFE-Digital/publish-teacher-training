# Slower polling for burstable QA / staging / sandbox / review databases.
# Explicit dispatcher from day one — Apply omitted this in production and delayed jobs stuck.
default:
  dispatchers:
    - polling_interval: 3
      batch_size: 500
      concurrency_maintenance_interval: 300
  workers:
    - queues: [default, geocoding, mailers]
      threads: 1
      processes: 1
      polling_interval: 3

    - queues: [save_statistic, low_priority]
      threads: 1
      processes: 1
      polling_interval: 3
