# Solid Queue recurring tasks — the only schedule source for PTT background jobs.
#
# Schedules use Europe/London so UK local midnight / DST behaviour matches
# config.time_zone = "Europe/London".
#
# The solid-queue-worker runs the scheduler. Every replica runs one, and the unique
# (task_key, run_at) index on solid_queue_recurring_executions enqueues each run once.
#
# Deployment checks: guides/solid-queue-recurring-cutover.md
# Rollback boundary: guides/adr/0022-solid-queue-and-redis-independence.md

# Finished-job / batch cleanup for environments that run the scheduler.
# Routed to low_priority so command jobs land on a consumed queue.
cleanup: &cleanup
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
    queue: low_priority
  clear_solid_queue_finished_batches:
    command: "SolidQueue::Batch.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
    queue: low_priority

production:
  <<: *cleanup
  save_statistic:
    class: SaveStatisticJob
    queue: low_priority
    schedule: "0 0 * * * Europe/London"
  send_entity_table_checks_to_bigquery:
    class: DfE::Analytics::EntityTableCheckJob
    queue: low_priority
    schedule: "30 0 * * * Europe/London"
  import_gias_schools:
    class: GiasImportJob
    queue: low_priority
    schedule: "30 2 * * * Europe/London"
  cleanup_recent_searches:
    class: CleanupRecentSearchesJob
    queue: low_priority
    schedule: "0 3 * * * Europe/London"
  cleanup_school_bulk_update_drafts:
    class: CleanupSchoolBulkUpdateDraftsJob
    queue: low_priority
    schedule: "0 3 * * * Europe/London"
  send_weekly_email_alerts:
    class: SendWeeklyEmailAlertsJob
    queue: low_priority
    schedule: "0 3 * * 5 Europe/London"

qa:
  <<: *cleanup
  save_statistic:
    class: SaveStatisticJob
    queue: low_priority
    schedule: "0 0 * * * Europe/London"
  cleanup_recent_searches:
    class: CleanupRecentSearchesJob
    queue: low_priority
    schedule: "0 3 * * * Europe/London"
  cleanup_school_bulk_update_drafts:
    class: CleanupSchoolBulkUpdateDraftsJob
    queue: low_priority
    schedule: "0 3 * * * Europe/London"

staging:
  <<: *cleanup
  save_statistic:
    class: SaveStatisticJob
    queue: low_priority
    schedule: "0 0 * * * Europe/London"

# No schedules in these environments — keep empty so the scheduler does not
# invent production-like recurrence.
sandbox: {}
review: {}
development: {}
test: {}
loadtest: {}
rollover: {}
