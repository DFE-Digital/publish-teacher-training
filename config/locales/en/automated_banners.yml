en:
  automated_banners:
    apply_deadline_soon:
      name: "Apply deadline soon"
      heading: "The deadline for applying to courses starting in the %{cycle_year_range} academic year is %{apply_deadline}"
      body: "Courses may fill up before then. Check course availability with the provider."
    apply_closed:
      name: "Apply has closed"
      heading: "The application deadline has passed"
      body: |-
        The application deadline has passed for courses starting in the %{cycle_year_range} academic year.

        From %{next_find_opens} you will be able to search for courses starting in the %{next_cycle_year_range} academic year. From %{next_apply_opens} you will be able to apply for these courses.
    rollover_started:
      name: "Rollover has started"
      heading: "Action required by %{action_required_by}: check and schedule your courses"
      body: |-
        Courses for the %{recruitment_cycle_year_range} recruitment cycle will be published on [Find teacher training courses](%{find_url}) on %{find_opens}. Before this, you need to check and schedule your rolled over courses. If you do not schedule your courses, candidates will not be able to see them when Find opens.

        Read [guidance on rolling over courses to a new recruitment cycle](%{guidance_path}) if you need help.
    apply_opens_soon:
      name: "Apply opens soon"
      heading: "Apply for courses from %{apply_opens}"
      body: |-
        The application deadline has passed for courses starting in the %{previous_cycle_year_range} academic year.

        You can now search for courses starting in the %{cycle_year_range} academic year. You can prepare applications for these courses, and from %{apply_opens} you will be able to submit your applications.
