en:
  publish:
    providers:
      course_fields:
        disability_support:
          edit:
            page_title: Adjustments to help you train to teach
            instructions_html: |
              <p class="govuk-body">Say how you support candidates with:</p>
              <ul class="govuk-list govuk-list--bullet">
                <li>neurodiversity</li>
                <li>long-term physical or mental health conditions</li>
                <li>other accessibility needs</li>
              </ul>
              <p class="govuk-body">You should include any adjustments you can make during the interview process and during training.</p>
              <p class="govuk-body">If accessibility varies between schools, give details. It’s also useful for candidates to know how you’ve accommodated others with specific needs in the past.</p>
            preview_heading: Adjustments to help you train to teach
            submit: Update adjustments to help you train to teach
  activemodel:
    errors:
      models:
        publish/disability_support_form:
          attributes:
            train_with_disability:
              blank: Enter how you support candidates with disabilities and other needs
              too_many_words: "Training with disabilities and other needs must be 250 words or less"

