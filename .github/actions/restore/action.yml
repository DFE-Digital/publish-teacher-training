name: restore
description: Restore AKS environment database

inputs:
  azure-storage-connection-string:
    required: true
  environment:
    description: Environment to restore to
    required: true
    type: choice
    options:
      - review
      - qa
      - staging
  pr-number:
    description: PR number for the review app
    required: false
  azure-client-id:
    description: Managed identity client ID
    required: true
  azure-subscription-id:
    description: Azure subscription ID
    required: true
  azure-tenant-id:
    description: Azure tenant ID
    required: true

runs:
  using: composite
  steps:
    - name: Set env variable
      shell: bash
      run: echo "SANITISED_FILE_NAME=publish_sanitised_$(date +"%F")" >> $GITHUB_ENV

    - name: Download Backup
      shell: bash
      run: |
        az storage blob download --container-name database-backup \
        --file ${SANITISED_FILE_NAME}.sql.gz --name ${SANITISED_FILE_NAME}.sql.gz \
        --connection-string '${{ inputs.azure-storage-connection-string }}'

    - name: Set environment variables for AKS
      shell: bash
      run: |
        tf_vars_file=terraform/aks/workspace_variables/${{ inputs.environment }}.tfvars.json
        echo "cluster=$(jq -r '.cluster' ${tf_vars_file})" >> $GITHUB_ENV
        echo "app_environment=$(jq -r '.app_environment' ${tf_vars_file})" >> $GITHUB_ENV
        echo "NAMESPACE=$(jq -r '.namespace' ${tf_vars_file})" >> $GITHUB_ENV

    - name: Set app name variable
      shell: bash
      run: |
        if [ "${{ env.app_environment }}" == "review" ] && [ "${{ inputs.pr-number }}" != "" ]; then
          echo "Set the app name to include the review app PR number."
          echo "app_name=publish-review-${{ inputs.pr-number }}" >> $GITHUB_ENV
        else
          echo "Set the app name to the environent name"
          echo "app_name=publish-${{ env.app_environment }}" >> $GITHUB_ENV
        fi

    - name: Set solid-queue-worker variables
      shell: bash
      run: |
        echo "SQ_WORKER_DEPLOYMENT=deployment/${{ env.app_name }}-solid-queue-worker" >> $GITHUB_ENV
        echo "SQ_WORKER_SELECTOR=app=${{ env.app_name }}-solid-queue-worker" >> $GITHUB_ENV

    - uses: azure/login@v3
      with:
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}
        client-id: ${{ inputs.azure-client-id }}

    - name: Install kubectl
      if: ${{ env.app_environment != 'review' }}
      uses: DFE-Digital/github-actions/set-kubectl@master

    - uses: DFE-Digital/github-actions/set-kubelogin-environment@master
      with:
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-subscription-id: ${{ inputs.azure-subscription-id }}
        azure-client-id: ${{ inputs.azure-client-id }}

    - name: K8 setup
      if: ${{ env.app_environment != 'review' }}
      shell: bash
      run: |
        make ci ${{ inputs.environment }} get-cluster-credentials
        make install-konduit

    # The restore drops and recreates every table (pg_dump --clean). Solid Queue must
    # not be running meanwhile or it hits UndefinedTable / UnknownPrimaryKey.
    - name: Stop solid-queue-worker before restore
      shell: bash
      run: |
        replicas=$(kubectl -n "${NAMESPACE}" get "${SQ_WORKER_DEPLOYMENT}" -o jsonpath='{.spec.replicas}')
        if [ -z "${replicas}" ]; then
          replicas=1
        fi
        echo "SQ_WORKER_REPLICAS=${replicas}" >> $GITHUB_ENV
        kubectl -n "${NAMESPACE}" scale "${SQ_WORKER_DEPLOYMENT}" --replicas=0

        worker_pods=$(kubectl -n "${NAMESPACE}" get pods -l "${SQ_WORKER_SELECTOR}" -o name)
        if [ -n "${worker_pods}" ]; then
          kubectl -n "${NAMESPACE}" wait --for=delete pod -l "${SQ_WORKER_SELECTOR}" --timeout=120s
        fi

        remaining_worker_pods=$(kubectl -n "${NAMESPACE}" get pods -l "${SQ_WORKER_SELECTOR}" -o name)
        if [ -n "${remaining_worker_pods}" ]; then
          echo "::error::Solid Queue worker pods remain after scale-down:"
          echo "${remaining_worker_pods}"
          exit 1
        fi

    - name: Restore backup to aks env database
      shell: bash
      run: |
        # Konduit does not forward psql flags, so wrap the dump in an error-stopping
        # transaction. gzip -d reads concatenated members, so the dump is not recompressed.
        ATOMIC_RESTORE_FILE="${SANITISED_FILE_NAME}_atomic.sql.gz"
        gzip --test "${SANITISED_FILE_NAME}.sql.gz"
        {
          printf '\\set ON_ERROR_STOP on\nBEGIN;\n' | gzip
          cat "${SANITISED_FILE_NAME}.sql.gz"
          printf '\nCOMMIT;\n' | gzip
        } > "${ATOMIC_RESTORE_FILE}"
        bin/konduit.sh -n ${NAMESPACE} -i "${ATOMIC_RESTORE_FILE}" -c -t 7200 -x ${{ env.app_name }} -- psql
        bin/konduit.sh -n ${NAMESPACE} -x -t 300 ${{ env.app_name }} -- psql -c 'drop publication airbyte_publication' || true

    - name: Restore solid-queue-worker replica count
      if: ${{ always() && env.SQ_WORKER_REPLICAS != '' }}
      shell: bash
      run: |
        kubectl -n "${NAMESPACE}" scale "${SQ_WORKER_DEPLOYMENT}" --replicas="${SQ_WORKER_REPLICAS}"
        if [ "${SQ_WORKER_REPLICAS}" != "0" ]; then
          kubectl -n "${NAMESPACE}" rollout status "${SQ_WORKER_DEPLOYMENT}" --timeout=300s
        fi
