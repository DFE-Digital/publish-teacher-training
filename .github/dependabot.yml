version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 8
    labels:
      - deploy
      - dependencies
      - ruby
    groups:
      dev-and-test:
        dependency-type: development
    ignore:
      - dependency-name: audited
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 8
    labels:
      - deploy
      - dependencies
      - javascript
    groups:
      dev-dependencies:
        dependency-type: development
    # stylelint-config-gds (and related configs) still require stylelint 17.
    # Drop these ignores once GDS ships a Stylelint 18-compatible release.
    ignore:
      - dependency-name: stylelint
        update-types: ["version-update:semver-major"]
      - dependency-name: stylelint-config-standard
        update-types: ["version-update:semver-major"]
  - package-ecosystem: bundler
    directory: "/docs"
    schedule:
      interval: daily
    open-pull-requests-limit: 8
    groups:
      docs:
        patterns:
          - "*"
    ignore:
      - dependency-name: govuk_tech_docs
        versions:
          - ">= 6.5, < 6.6"
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: daily
    open-pull-requests-limit: 8
    labels:
      - github_actions
    groups:
      actions:
        patterns:
          - "*"
