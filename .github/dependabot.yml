version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 8
    labels:
      - deploy
      - dependencies
      - ruby
    groups:
      dev-and-test:
        dependency-type: development
    ignore:
      - dependency-name: audited
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 8
    labels:
      - deploy
      - dependencies
      - javascript
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: bundler
    directory: "/docs"
    schedule:
      interval: daily
    open-pull-requests-limit: 8
    groups:
      docs:
        patterns:
          - "*"
    ignore:
      - dependency-name: govuk_tech_docs
        versions:
          - ">= 6.5, < 6.6"
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: daily
    open-pull-requests-limit: 8
    labels:
      - github_actions
    groups:
      actions:
        patterns:
          - "*"
