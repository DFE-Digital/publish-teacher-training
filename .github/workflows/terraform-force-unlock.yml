name: Force unlock Terraform state

# Break-glass only. Clears a stale remote state lock when deploys fail with
# "Error acquiring the state lock". Never run while a real plan/apply is in
# progress for the same environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose AKS Terraform state to unlock
        required: true
        type: choice
        default: qa
        options:
          - qa
          - staging
          - sandbox
          - production
      lock_id:
        description: Lock ID from the Terraform error (Lock Info → ID)
        required: true
        type: string
      confirm:
        description: Type the environment name again to confirm (e.g. production)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  force-unlock:
    name: Force unlock ${{ inputs.environment }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-or-database-restore-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Confirm environment name
        env:
          CONFIRM: ${{ inputs.confirm }}
          LOCK_ID_INPUT: ${{ inputs.lock_id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$CONFIRM" != "$ENVIRONMENT" ]; then
            echo "::error::confirm must exactly match the environment name ($ENVIRONMENT)"
            exit 1
          fi

          if [[ ! "$LOCK_ID_INPUT" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::lock_id does not look like a Terraform lock UUID"
            exit 1
          fi

          echo "LOCK_ID=$LOCK_ID_INPUT" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Terraform version
        run: |
          terraform_version=$(awk '/{/{f=/^terraform/;next}f' terraform/aks/providers.tf | grep -o '[0-9\.]*')
          echo "TERRAFORM_VERSION=$terraform_version" >> "$GITHUB_ENV"

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - uses: google-github-actions/auth@v3
        with:
          project_id: rugged-abacus-218110
          workload_identity_provider: projects/712009772377/locations/global/workloadIdentityPools/publish-teacher-training/providers/publish-teacher-training

      - name: Initialise Terraform backend
        run: make ci ${{ inputs.environment }} deploy-init
        env:
          IMAGE_TAG: main

      - name: Force unlock state
        id: unlock
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set +e
          output=$(terraform -chdir=terraform/aks force-unlock -force "${LOCK_ID}" 2>&1)
          code=$?
          set -e
          echo "$output"

          if [ "$code" -eq 0 ]; then
            echo "result=unlocked" >> "$GITHUB_OUTPUT"
            echo "State unlocked for ${ENVIRONMENT} (lock ${LOCK_ID})"
            exit 0
          fi

          if echo "$output" | grep -qiE 'state not locked|Failed to unlock state:.*not locked'; then
            echo "result=already_unlocked" >> "$GITHUB_OUTPUT"
            echo "State was already unlocked for ${ENVIRONMENT}"
            exit 0
          fi

          # Empty terraformlockid metadata can mean either "not locked" or a stuck
          # blob lease with no lock metadata. force-unlock cannot clear the latter.
          if echo "$output" | grep -qiE 'terraformlockid[" ]*was empty|blob metadata.*terraformlockid'; then
            backend_file="terraform/aks/workspace_variables/${ENVIRONMENT}_backend.tfvars"
            storage_account=$(awk -F'"' '/storage_account_name/{print $2; exit}' "$backend_file")
            container_name=$(awk -F'"' '/container_name/{print $2; exit}' "$backend_file")
            blob_name=$(awk -F'"' '/^[[:space:]]*key[[:space:]]*=/{print $2; exit}' "$backend_file")

            set +e
            lease_state=$(az storage blob show \
              --account-name "$storage_account" \
              --container-name "$container_name" \
              --name "$blob_name" \
              --auth-mode login \
              --query "properties.lease.state" -o tsv 2>&1)
            az_code=$?
            set -e

            if [ "$az_code" -ne 0 ]; then
              echo "::error::Could not read state blob lease state: $lease_state"
              echo "result=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            echo "State blob lease.state=${lease_state}"

            case "$lease_state" in
              available|expired|broken)
                echo "result=already_unlocked" >> "$GITHUB_OUTPUT"
                echo "State was already unlocked for ${ENVIRONMENT} (no active lease)"
                exit 0
                ;;
              leased|breaking)
                echo "::error::State blob has a ${lease_state} lease but no Terraform lock metadata. force-unlock cannot clear it — break the lease (see aks-cheatsheet Stuck Terraform state lock), then re-run the deploy."
                echo "result=stuck_lease" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
              *)
                echo "::error::Unexpected state blob lease.state '${lease_state}'"
                echo "result=failed" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
            esac
          fi

          if echo "$output" | grep -qiE 'does not match existing lock|lock id .* does not match'; then
            echo "::error::lock_id does not match the current lock. Copy the ID from the latest deploy error and try again."
            echo "result=mismatch" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "::error::force-unlock failed"
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Notify teams channel
        if: always() && (steps.unlock.conclusion == 'success' || steps.unlock.conclusion == 'failure')
        uses: DFE-Digital/github-actions/send-to-teams-channel@master
        with:
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: Terraform force-unlock (${{ inputs.environment }})
          service: Publish teacher training
          message: |
            Actor: ${{ github.actor }}
            Environment: ${{ inputs.environment }}
            Lock ID: ${{ inputs.lock_id }}
            Result: ${{ steps.unlock.outputs.result || 'failed' }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
