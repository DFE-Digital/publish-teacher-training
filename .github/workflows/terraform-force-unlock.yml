name: Force unlock Terraform state

# Break-glass only. Clears a stale remote state lock when deploys fail with
# "Error acquiring the state lock". Never run while a real plan/apply is in
# progress for the same environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose AKS Terraform state to unlock
        required: true
        type: choice
        default: qa
        options:
          - qa
          - staging
          - sandbox
          - production
      lock_id:
        description: Lock ID from the Terraform error (Lock Info → ID). Leave blank if the error shows no lock ID.
        required: false
        type: string
      confirm:
        description: Type the environment name again to confirm (e.g. production)
        required: true
        type: string
      break_stuck_lease:
        description: Break the state blob lease if it is held with no Terraform lock on it
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  force-unlock:
    name: Force unlock ${{ inputs.environment }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-or-database-restore-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Validate inputs
        env:
          CONFIRM: ${{ inputs.confirm }}
          LOCK_ID_INPUT: ${{ inputs.lock_id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$CONFIRM" != "$ENVIRONMENT" ]; then
            echo "::error::confirm must exactly match the environment name ($ENVIRONMENT)"
            exit 1
          fi

          if [ -n "$LOCK_ID_INPUT" ] && [[ ! "$LOCK_ID_INPUT" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::lock_id does not look like a Terraform lock UUID"
            exit 1
          fi

          echo "LOCK_ID=$LOCK_ID_INPUT" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Terraform version
        if: env.LOCK_ID != ''
        run: |
          terraform_version=$(awk '/{/{f=/^terraform/;next}f' terraform/aks/providers.tf | grep -o '[0-9\.]*')
          echo "TERRAFORM_VERSION=$terraform_version" >> "$GITHUB_ENV"

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        if: env.LOCK_ID != ''
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - uses: google-github-actions/auth@v3
        if: env.LOCK_ID != ''
        with:
          project_id: rugged-abacus-218110
          workload_identity_provider: projects/712009772377/locations/global/workloadIdentityPools/publish-teacher-training/providers/publish-teacher-training

      - name: Initialise Terraform backend
        if: env.LOCK_ID != ''
        run: make ci ${{ inputs.environment }} deploy-init
        env:
          IMAGE_TAG: main

      - name: Force unlock state
        id: unlock
        if: env.LOCK_ID != ''
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set +e
          output=$(terraform -chdir=terraform/aks force-unlock -force "${LOCK_ID}" 2>&1)
          code=$?
          set -e
          echo "$output"

          if [ "$code" -eq 0 ]; then
            echo "result=unlocked" >> "$GITHUB_OUTPUT"
            echo "State unlocked for ${ENVIRONMENT} (lock ${LOCK_ID})"
            exit 0
          fi

          if echo "$output" | grep -qiE 'state not locked|Failed to unlock state:.*not locked'; then
            echo "result=already_unlocked" >> "$GITHUB_OUTPUT"
            echo "State was already unlocked for ${ENVIRONMENT}"
            exit 0
          fi

          # Empty terraformlockid metadata means either "not locked" or a blob
          # lease with no lock on it. The next step checks the lease to tell.
          if echo "$output" | grep -qiE 'terraformlockid[" ]*was empty|blob metadata.*terraformlockid'; then
            echo "result=check_lease" >> "$GITHUB_OUTPUT"
            echo "No Terraform lock metadata on the state blob, checking the blob lease"
            exit 0
          fi

          if echo "$output" | grep -qiE 'does not match existing lock|lock id .* does not match'; then
            echo "::error::lock_id does not match the current lock. Copy the ID from the latest deploy error and try again."
            echo "result=mismatch" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "::error::force-unlock failed"
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit "$code"

      # Uses the storage account key (looked up with the deploy identity, the
      # same way the Terraform backend does) so no blob data RBAC role is needed.
      - name: Check state blob lease
        id: lease
        if: env.LOCK_ID == '' || steps.unlock.outputs.result == 'check_lease'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BREAK_STUCK_LEASE: ${{ inputs.break_stuck_lease }}
        run: |
          finish() {
            echo "result=$1" >> "$GITHUB_OUTPUT"
            exit "$2"
          }

          backend_file="terraform/aks/workspace_variables/${ENVIRONMENT}_backend.tfvars"
          tfvar() { awk -F'"' -v name="$1" '$0 ~ "^[[:space:]]*" name "[[:space:]]*=" {print $2; exit}' "$backend_file"; }
          resource_group=$(tfvar resource_group_name)
          export AZURE_STORAGE_ACCOUNT=$(tfvar storage_account_name)
          container_name=$(tfvar container_name)
          blob_name=$(tfvar key)

          set +e
          AZURE_STORAGE_KEY=$(az storage account keys list \
            --resource-group "$resource_group" \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --query "[0].value" -o tsv)
          az_code=$?
          set -e
          if [ "$az_code" -ne 0 ] || [ -z "$AZURE_STORAGE_KEY" ]; then
            echo "::error::Could not read the state storage account key"
            finish failed 1
          fi
          echo "::add-mask::$AZURE_STORAGE_KEY"
          export AZURE_STORAGE_KEY

          blob_status() {
            az storage blob show \
              --container-name "$container_name" \
              --name "$blob_name" \
              --query "{lease: properties.lease.state, lock: metadata.terraformlockid}" -o json
          }

          set +e
          status=$(blob_status)
          az_code=$?
          set -e
          if [ "$az_code" -ne 0 ]; then
            echo "::error::Could not read the state blob"
            finish failed 1
          fi

          lease_state=$(jq -r '.lease // ""' <<< "$status")
          lock_meta=$(jq -r '.lock // ""' <<< "$status")
          echo "State blob lease state: ${lease_state}"

          case "$lease_state" in
            available|expired|broken)
              echo "State was already unlocked for ${ENVIRONMENT} (no active lease)"
              finish already_unlocked 0
              ;;
            leased|breaking)
              ;;
            *)
              echo "::error::Unexpected state blob lease state '${lease_state}'"
              finish failed 1
              ;;
          esac

          if [ -n "$lock_meta" ]; then
            echo "State is locked by Terraform:"
            base64 -d <<< "$lock_meta" 2>/dev/null \
              | jq -r '"  ID: \(.ID)\n  Operation: \(.Operation)\n  Who: \(.Who)\n  Created: \(.Created)"' 2>/dev/null \
              || echo "  (could not decode lock info)"
            echo "::error::State has a Terraform lock. Re-run with the lock ID shown above (check it is stale first)."
            finish locked 1
          fi

          if [ "$BREAK_STUCK_LEASE" != "true" ]; then
            echo "::error::State blob has a ${lease_state} lease but no Terraform lock on it, so force-unlock cannot clear it. Re-run with break_stuck_lease ticked to break the lease."
            finish stuck_lease 1
          fi

          echo "Breaking ${lease_state} lease on ${container_name}/${blob_name}"
          set +e
          az storage blob lease break \
            --container-name "$container_name" \
            --blob-name "$blob_name" \
            --lease-break-period 0 -o none
          az_code=$?
          set -e
          if [ "$az_code" -ne 0 ]; then
            echo "::error::Could not break the state blob lease"
            finish failed 1
          fi

          set +e
          status=$(blob_status)
          az_code=$?
          set -e
          lease_state=$(jq -r '.lease // ""' <<< "$status")
          echo "State blob lease state after break: ${lease_state}"
          if [ "$az_code" -ne 0 ] || [ "$lease_state" = "leased" ]; then
            echo "::error::Could not confirm the state blob lease was released"
            finish failed 1
          fi

          finish lease_broken 0

      - name: Notify teams channel
        if: >-
          always() && (
            steps.unlock.conclusion == 'success' || steps.unlock.conclusion == 'failure' ||
            steps.lease.conclusion == 'success' || steps.lease.conclusion == 'failure'
          )
        uses: DFE-Digital/github-actions/send-to-teams-channel@master
        with:
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: Terraform force-unlock (${{ inputs.environment }})
          service: Publish teacher training
          message: |
            Actor: ${{ github.actor }}
            Environment: ${{ inputs.environment }}
            Lock ID: ${{ inputs.lock_id || 'none given' }}
            Break stuck lease: ${{ inputs.break_stuck_lease }}
            Result: ${{ steps.lease.outputs.result || steps.unlock.outputs.result || 'failed' }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
