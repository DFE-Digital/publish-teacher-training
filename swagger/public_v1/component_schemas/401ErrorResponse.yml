description: "This schema is used to return a 401 application error"
type: object
required:
  - errors
properties:
  errors:
    type: array
    items:
      type: object
      properties:
        status:
          type: integer
          description: "Returns the http status code associated with the error."
          example: 401
        title:
          type: string
          description: "A generic title for the type of error."
          example: "UNAUTHORIZED"
        detail:
          type: string
          description: "A more detailed description of what could have caused the error."
          example: "The API key was not accepted. Send an active key in the Authorization header using the Bearer scheme, and never in the URL"
