plugins:
  - rubocop-factory_bot
  - rubocop-rspec_rails

inherit_gem:
  rubocop-govuk:
    - config/default.yml
    - config/rails.yml
    - config/rspec.yml

inherit_mode:
  merge:
    - Exclude

inherit_from:
  - '.rubocop_todo.yml'
  - 'config/rubocop/rspec.yml'
  - 'config/rubocop/naming.yml'
  - 'config/rubocop/layout.yml'

AllCops:
  ParserEngine: parser_prism
  TargetRubyVersion: 3.4

Rails/SaveBang:
  AllowImplicitReturn: true

# rubocop-capybara 3.0 enables this and only allows have_text; we use
# have_content (its alias) across the specs.
Capybara/RSpec/HaveContent:
  Enabled: false

# Historical migrations that have already run; not worth rewriting.
Rails/ReversibleMigration:
  Exclude:
    - 'db/migrate/20211221133521_drop_nctl_organisation_table.rb'
    - 'db/migrate/20211231135738_update_uniq_index_on_site.rb'
    - 'db/migrate/20220421115022_remove_discard_indexes_from_site.rb'

# dfe-analytics' matcher takes the event type(s) as the expectation subject,
# e.g. `expect(:create_entity).to have_been_enqueued_as_analytics_events`.
RSpec/ExpectActual:
  Exclude:
    - 'spec/services/provider_schools/removal_spec.rb'
    - 'spec/system/publish/dfe_analytics_events_spec.rb'
